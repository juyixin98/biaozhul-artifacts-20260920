[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80
markers =
    unit: pure unit tests on exact arithmetic and parsing
    kernel: isolation kernel tests
    evidence: independent numeric evidence tests
    service: application service classification tests
    integration: end-to-end HTTP tests
