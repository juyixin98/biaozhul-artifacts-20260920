[pytest]
testpaths = tests
addopts = -ra --strict-markers --showlocals
markers =
    semantics: rule-language and timeline semantics
    reference: exhaustive reference enumerator
    solver: budgeted DFS solver
    differential: independent-oracle cross checks
    storage: SQLite evidence store
    api: HTTP interface
    budget: budget expiry semantics
log_cli = false
log_format = %(asctime)s %(levelname)s %(name)s | %(message)s
filterwarnings =
    ignore::DeprecationWarning
