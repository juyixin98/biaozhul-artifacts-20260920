name: desklens-text5b

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desklens
      POSTGRES_PASSWORD: desklens
      POSTGRES_DB: desklens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desklens"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55441:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://desklens:desklens@db:5432/desklens?sslmode=disable
      ADDR: :8080
      SEED_DEMO_DATA: "true"
      SEED_FILE: /seed/seed.sql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18095:8080"

volumes:
  pgdata:
