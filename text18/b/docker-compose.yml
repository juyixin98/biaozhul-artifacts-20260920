services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sircc
      POSTGRES_PASSWORD: sircc
      POSTGRES_DB: sircc
    ports:
      - "5432:5432"
    volumes:
      - sircc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sircc -d sircc"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://sircc:sircc@db:5432/sircc?sslmode=disable"
      MIGRATIONS_DIR: "/app/migrations"
      REMINDER_INTERVAL: "10s"
      REMINDER_BATCH_SIZE: "100"
    ports:
      - "8080:8080"

volumes:
  sircc_pgdata:
