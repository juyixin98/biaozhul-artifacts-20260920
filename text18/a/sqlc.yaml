version: "2"
sql:
  - engine: "postgresql"
    schema:
      - internal/database/migrations/0001_core.up.sql
      - internal/database/migrations/0002_reminders.up.sql
    queries: "internal/database/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
