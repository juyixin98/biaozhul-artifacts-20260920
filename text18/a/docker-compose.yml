name: sircc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sircc
      POSTGRES_PASSWORD: sircc
      POSTGRES_DB: sircc
    ports:
      - "5432:5432"
    volumes:
      - sircc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sircc -d sircc"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: sircc-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIRCC_HTTP_ADDR: ":8080"
      SIRCC_DATABASE_URL: "postgres://sircc:sircc@db:5432/sircc?sslmode=disable"
      SIRCC_SCHEDULER_INTERVAL: "10s"
    ports:
      - "8080:8080"

  # One-shot migration job (also runs automatically at api startup). Use:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    image: sircc-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIRCC_DATABASE_URL: "postgres://sircc:sircc@db:5432/sircc?sslmode=disable"

volumes:
  sircc_pgdata:
