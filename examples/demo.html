<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StageVault 演示控制台</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <style>
    :root { --bg:#0f1220; --card:#1a1f36; --line:#2a3152; --fg:#e8ebff; --muted:#9aa3c7; --acc:#6c8cff; --ok:#3ecf8e; --warn:#ffb454; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    header code { background:#0008; padding:2px 8px; border-radius:6px; }
    main { display:grid; grid-template-columns:320px 1fr 320px; gap:16px; padding:16px 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
    input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#11152a; color:var(--fg); width:100%; }
    button { cursor:pointer; margin-top:8px; background:var(--acc); border-color:var(--acc); color:#0b1030; font-weight:600; }
    button.ghost { background:transparent; color:var(--fg); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    label { display:block; margin:10px 0 4px; color:var(--muted); font-size:12px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; background:#0008; font-size:12px; }
    .badge.live { background:rgba(62,207,142,.18); color:var(--ok); }
    .badge.lobby { background:rgba(108,140,255,.18); color:var(--acc); }
    .badge.paused { background:rgba(255,180,84,.18); color:var(--warn); }
    .badge.ended { background:rgba(255,90,90,.2); color:#ff8080; }
    #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; height:520px; overflow:auto; }
    #log .e { padding:3px 0; border-bottom:1px dashed #222a4a; }
    .muted { color:var(--muted); }
    .scene { padding:8px 10px; border-radius:8px; margin:4px 0; background:#11152a; }
    .scene.current { outline:2px solid var(--acc); }
    .hand { display:flex; justify-content:space-between; padding:6px 10px; background:#11152a; border-radius:8px; margin:6px 0; }
    .code { font-size:28px; letter-spacing:.3em; font-weight:700; text-align:center; padding:10px; }
    @media (max-width:1000px){ main{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <h1>StageVault 演示控制台</h1>
  <label style="margin:0">API <input id="api" value="http://localhost:3000" style="width:220px"/></label>
  <span id="conn" class="badge">未连接</span>
  <span class="muted" id="seqinfo"></span>
</header>
<main>
  <section class="card">
    <h2>会话</h2>
    <div id="hostPanel">
      <label>主持人用户ID</label><input id="hostId" value="host-demo"/>
      <button onclick="hostCreate()">创建演示文稿并发布会话</button>
      <div class="code" id="joinCode">— —</div>
    </div>
    <hr style="border-color:var(--line)"/>
    <div id="joinPanel">
      <label>加入码</label><input id="code" placeholder="6 位加入码"/>
      <label>你的名字</label><input id="name" placeholder="参与者名字"/>
      <button class="ghost" onclick="joinSession()">加入 / 连接</button>
    </div>
    <hr style="border-color:var(--line)"/>
    <div id="controls"></div>
  </section>

  <section class="card">
    <h2>场景（绑定已发布的不可变版本）</h2>
    <div id="meta" class="muted">尚未连接会话</div>
    <div id="scenes"></div>
    <h2 style="margin-top:18px">事件日志（按服务端序号）</h2>
    <div id="log"><div class="muted">等待事件…</div></div>
  </section>

  <section class="card">
    <h2>举手队列（服务端接收顺序）</h2>
    <div id="hands" class="muted">无人举手</div>
    <h2 style="margin-top:18px">参与者（≤25）</h2>
    <div id="participants"></div>
  </section>
</main>

<script>
let socket = null;
let snapshot = null;
let me = null;          // { userId, role }
let sessionCode = null;
const applied = new Map(); // seq -> event (去重/防回退)

function api() { return document.getElementById('api').value.replace(/\/$/, ''); }
async function http(method, path, body, userId) {
  const res = await fetch(api() + path, {
    method,
    headers: { 'content-type': 'application/json', ...(userId ? { 'x-user-id': userId } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.message || res.status), { body: json });
  return json;
}
const rid = () => 'req-' + Math.random().toString(36).slice(2);

async function hostCreate() {
  const hostId = document.getElementById('hostId').value.trim();
  const deck = await http('POST', '/presentations', {
    title: 'StageVault Demo', hostId,
    scenes: [{title:'欢迎'},{title:'系统架构'},{title:'实时同步'},{title:'问答环节'}],
  });
  await http('POST', `/presentations/${deck.id}/publish`, null, hostId);
  const session = await http('POST', '/sessions', {
    hostId, hostName: '主持人', presentationId: deck.id, version: 1,
  });
  document.getElementById('joinCode').textContent = session.code;
  document.getElementById('code').value = session.code;
  document.getElementById('name').value = '主持人';
  await joinSession(hostId);
}

async function joinSession(forceUserId) {
  sessionCode = document.getElementById('code').value.trim().toUpperCase();
  const name = document.getElementById('name').value.trim() || '参与者';
  const userId = forceUserId || 'u-' + Math.random().toString(36).slice(2, 10);
  const joined = await http('POST', `/sessions/${sessionCode}/join`, { userId, name });
  me = { userId, name, role: joined.role };
  renderSnapshot(joined.snapshot);
  connectSocket(joined.snapshot.sessionId, userId, lastAppliedSeq());
}

function lastAppliedSeq() {
  return Math.max(-1, ...Array.from(applied.keys()));
}

function connectSocket(sessionId, userId, lastSeq) {
  socket?.close();
  socket = io(api(), { auth: { sessionId, userId, lastSeq }, transports: ['websocket'] });
  socket.on('connected', (msg) => {
    setConn(true);
    if (msg.kind === 'snapshot') {
      renderSnapshot(msg.snapshot);
    } else {
      msg.events.forEach(applyEvent);
    }
  });
  socket.on('event', applyEvent);
  socket.on('snapshot', (m) => renderSnapshot(m.snapshot));
  socket.on('disconnect', () => setConn(false));
}
function setConn(ok){ document.getElementById('conn').textContent = ok ? '已同步' : '连接断开，将重放补齐'; document.getElementById('conn').className = 'badge ' + (ok?'live':'ended'); }

function applyEvent(e) {
  // 重复/乱序消息不能让状态回退：同一 seq 只接受一次。
  if (applied.has(e.seq)) return;
  applied.set(e.seq, e);
  logEvent(e);
  // 事件携带的 version 就是事件序号；刷新快照序号展示
  document.getElementById('seqinfo').textContent = '最后序号: ' + Math.max(...applied.keys(), snapshot?.version ?? 0);
  // 拉一次快照来更新场景/队列/人数（演示用；也可只依赖事件 payload）
  refreshSnapshot().catch(()=>{});
}

async function refreshSnapshot() {
  const s = await http('GET', `/sessions/${sessionCode}/snapshot`, null, me.userId);
  renderSnapshot(s);
}

function renderSnapshot(s) {
  snapshot = s;
  document.getElementById('meta').innerHTML =
    `状态 <span class="badge ${s.status}">${s.status}</span> · 版本序号 <b>${s.version}</b> · 绑定演示版本 v${s.versionNo} · 加入码 <code>${s.code}</code>`;
  document.getElementById('scenes').innerHTML = s.scenes.map((sc, i) =>
    `<div class="scene ${i === s.currentSceneIndex ? 'current' : ''}">${i+1}. ${sc.title}${sc.notes?`<div class="muted">${sc.notes}</div>`:''}</div>`).join('');
  document.getElementById('hands').innerHTML = s.handQueue.length
    ? s.handQueue.map(h => `<div class="hand"><span>#${h.order} ${h.name}</span>${me.role==='host'?`<button style="width:auto;margin:0" onclick="handleHand('${h.userId}')">处理</button>`:''}</div>`).join('')
    : '<div class="muted">无人举手</div>';
  document.getElementById('participants').innerHTML =
    s.participants.map(p => `<div class="hand"><span>${p.name}</span><span class="muted">${p.role}</span></div>`).join('');
  renderControls(s);
  document.getElementById('seqinfo').textContent = '最后序号: ' + Math.max(s.version, ...applied.keys());
}

function renderControls(s) {
  const host = me.role === 'host';
  const btns = [];
  if (host) {
    if (s.status === 'lobby') btns.push(['start','开始直播']);
    if (s.status === 'live') btns.push(['pause','暂停']);
    if (s.status === 'paused') btns.push(['resume','继续']);
    if (s.status !== 'ended') btns.push(['end','结束会话']);
  }
  const sceneNav = host && (s.status === 'live' || s.status === 'paused') ? `
    <div class="row">
      <button class="ghost" onclick="changeScene(${Math.max(0,s.currentSceneIndex-1)})">◀ 上一场景</button>
      <button class="ghost" onclick="changeScene(${Math.min(s.scenes.length-1,s.currentSceneIndex+1)})">下一场景 ▶</button>
    </div>` : '';
  const handBtns = s.status !== 'ended' ? `
    <div class="row">
      <button class="ghost" onclick="raiseHand()">举手</button>
      <button class="ghost" onclick="cancelHand()">取消举手</button>
    </div>` : '';
  document.getElementById('controls').innerHTML =
    btns.map(([c,t]) => `<button onclick="command('${c}')">${t}</button>`).join('') + sceneNav + handBtns;
}

async function command(command, extra = {}) {
  try {
    await http('POST', `/sessions/${sessionCode}/commands`,
      { requestId: rid(), expectedVersion: snapshot.version, command, ...extra }, me.userId);
  } catch (e) { alert('命令被拒绝: ' + (e.body?.error ?? e.message)); }
}
const changeScene = (i) => command('changeScene', { sceneIndex: i });
const raiseHand = () => command('raiseHand', { name: me.name });
const cancelHand = () => command('cancelHand');
const handleHand = (u) => command('handleHand', { targetUserId: u });

function logEvent(e) {
  const box = document.getElementById('log');
  if (box.firstChild?.classList?.contains('muted')) box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'e';
  div.innerHTML = `<span class="muted">#${String(e.seq).padStart(3,'0')}</span> <b>${e.type}</b> <span class="muted">${new Date(e.createdAt).toLocaleTimeString()}</span><pre style="margin:2px 0 0 36px">${JSON.stringify(e.payload)}</pre>`;
  box.prepend(div);
}
</script>
</body>
</html>
