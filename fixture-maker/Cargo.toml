[package]
name = "fixture-maker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build local OCI fixture images (benign and malicious) for oci-unpack tests"

[lib]
name = "fixture_maker"
path = "src/lib.rs"

[[bin]]
name = "fixture-maker"
path = "src/main.rs"

[dependencies]
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
