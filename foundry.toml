[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
# Emit the full storage layout used by the Python checker.
extra_output = ["storageLayout"]

# Deterministic build info paths simplify layout export.
build_info = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
