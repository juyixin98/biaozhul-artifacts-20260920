[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Deterministic, dependency-locked build: OpenZeppelin v4.9.6
# utils/math/Math.sol is vendored under lib/, forge-std pinned at v1.9.7.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin/contracts/",
]
ffi = false

[invariant]
runs = 256
depth = 32

[fmt]
line_length = 120
tab_width = 4
