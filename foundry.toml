[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# The project deliberately has NO third-party Solidity dependencies
# (no forge-std): tests use a minimal built-in `Vm` cheatcode interface.

[fmt]
line_length = 100
tab_width = 4
