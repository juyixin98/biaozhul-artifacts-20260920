[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 40
fail_on_revert = true
