[profile.default]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
src = "src"
test = "test"
script = "script"
libs = ["lib"]
fs_permissions = [{ access = "write", path = "./artifacts" }]

# More verbose traces during acceptance runs
[profile.ci]
fuzz = { runs = 256 }
verbosity = 4
