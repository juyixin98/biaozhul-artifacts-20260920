[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
# 两条相互独立的本地区块链（仅用于演示，并非真实跨链通道）
chain_a = "http://127.0.0.1:8545"
chain_b = "http://127.0.0.1:8546"

[fmt]
line_length = 120
tab_width = 4
