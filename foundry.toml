[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Deterministic, local-only build. No remappings: the project is self-contained.
[fuzz]
runs = 2000
# 0 => fail-fast for any invariant scenario, never silently pass on reverts that
# actually mask a bug (bounded callers handle expected reverts explicitly).
fail_on_revert = false

[invariant]
runs = 256
depth = 30
fail_on_revert = false
