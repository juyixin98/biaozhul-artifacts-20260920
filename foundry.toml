[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Output compact artifacts used by the Python deployment script.
extra_output = ["storageLayout"]
extra_output_files = ["abi", "bin"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
