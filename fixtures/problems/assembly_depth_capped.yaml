# Same 5-level BOM but a depth cap that must be hit while decomposing.
# Expected: DEPTH_EXCEEDED (a bound, not a crash).
name: assembly-depth-capped
domain: assembly
initial_facts:
  - [atomic, leaf]
  - [available, leaf]
  - [child_of, a3, leaf]
  - [child_of, a2, a3]
  - [child_of, a1, a2]
  - [child_of, root, a1]
goal_task: assemble
goal_args: [root]
max_depth: 2
max_expansions: 256
