name: civicledger

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civicledger
    ports:
      - "55434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civicledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civicledger
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civicledger
      TEST_DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civicledger_test
    command: sh -c "python scripts/ensure_test_db.py && pytest -q"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
