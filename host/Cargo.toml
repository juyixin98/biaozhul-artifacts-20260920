[package]
name = "vcr-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "vcr_host"
path = "src/lib.rs"

[[bin]]
name = "vcr-host"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
methods = { path = "../methods" }
# NOTE: "prove" is deliberately NOT enabled and dev mode is rejected at
# runtime, so a misplaced RISC0_DEV_MODE can never be treated as a real proof.
risc0-zkvm = { version = "^3.0.6", default-features = false, features = ["client", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.11"
hex = "0.4"
anyhow = "1.0"

[dev-dependencies]
serial_test = "3"
