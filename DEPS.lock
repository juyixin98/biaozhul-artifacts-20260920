# 依赖锁定（Dependency Lock）
#
# 本项目刻意保持“零第三方依赖”：全部代码只使用 JDK 自带 API，
# 因此没有任何需要下载的 jar，也就不存在传递依赖或供应链版本漂移。
#
# 构建期依赖（唯一）：
#   JDK：在本机实测锁定为 Temurin OpenJDK 17.0.20.1+1
#         （目标字节码/源级别通过 `javac --release 17` 锁定，
#          任意厂商 JDK 17+ 均可编译；未在其他版本上实测）
#
# 运行期依赖：
#   仅 JRE/JDK 17+。核心用到的 JDK 模块：
#     - jdk.httpserver (com.sun.net.httpserver.HttpServer) —— HTTP 服务
#     - java.base      (BigDecimal 定点数、集合、并发、java.net.http 测试客户端)
#
# 第三方库：无（JSON 解析/序列化、测试断言框架均为项目内自写的最小实现）。
# 包管理器：不使用 Maven/Gradle；构建仅靠 javac，见 build.sh / test.sh。
#
# 实测环境（2026-09-23）：
#   OS    : Linux 6.8.0-90-generic x86_64
#   JDK   : Temurin 17.0.20.1+1（~/jdk17）
#   shell : bash；演示脚本另用到 curl（仅演示，非服务依赖）
