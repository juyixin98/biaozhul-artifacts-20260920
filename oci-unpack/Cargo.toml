[package]
name = "oci-unpack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline OCI image layered whitelist unpacker (Axum backend)"

[[bin]]
name = "oci-unpack-server"
path = "src/main.rs"

[lib]
name = "oci_unpack"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
fixture-maker = { path = "../fixture-maker" }
