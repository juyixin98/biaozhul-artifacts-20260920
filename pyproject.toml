[project]
name = "battery-telemetry-soc"
version = "1.0.0"
description = "Offline SOC estimation for synthetic battery telemetry (coulomb integration + OCV calibration). Not for real battery control."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
