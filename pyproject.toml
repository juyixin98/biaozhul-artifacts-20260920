[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-dependency-matching"
version = "1.0.0"
description = "Offline SBOM (CycloneDX subset) dependency matching service with per-ecosystem version comparison"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
