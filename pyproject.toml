[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rete-production-engine"
version = "1.0.0"
description = "Structured Rete production-rule matching network with evidence storage"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov==7.1.0", "coverage==7.16.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["reteapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
log_cli = false

[tool.coverage.run]
source = ["reteapp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
