[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wfst-service"
version = "1.0.0"
description = "小型加权有限状态转换器（WFST）服务：词典映射、epsilon 组合、最短输出"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1", "pytest-cov==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
