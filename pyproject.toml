[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvp-service"
version = "0.1.0"
description = "Hessian-vector products for restricted differentiable expressions (FastAPI/NumPy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "numpy==2.4.6",
    "mpmath==1.3.0",
]

[tool.setuptools.packages.find]
include = ["hvpsvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hvpsvc"]
branch = true
