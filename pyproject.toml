[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bucket-sync-teaching-runtime"
version = "0.1.0"
description = "Local multi-process teaching runtime for gradient bucketing and weighted all-reduce"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast in-process unit tests",
    "integration: tests over real HTTP or real worker processes",
]
