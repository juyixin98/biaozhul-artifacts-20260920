[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mospp"
version = "0.1.0"
description = "多目标（双目标：时间/费用）最短路纯后端计算库与 JSON 接口"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
mospp = "mospp.__main__:main"

[tool.setuptools]
packages = ["mospp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
