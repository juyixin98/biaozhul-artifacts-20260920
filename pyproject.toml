[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strips-planner"
version = "1.0.0"
description = "STRIPS-style offline planning service with FastAPI and SQLite evidence storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "unit: kernel and language unit tests",
    "integration: end-to-end tests over the real service and SQLite store",
]
addopts = "-ra"
