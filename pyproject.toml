[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summation-compare-api"
version = "1.0.0"
description = "Backend comparing naive, pairwise and compensated (Kahan) summation over large/streaming sequences, with high-precision error evidence."
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.15.3",
    "mpmath==1.3.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
