[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-lp"
version = "0.1.0"
description = "两阶段单纯形求解器（纯后端，NumPy 实现，小中规模线性规划）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
blp = "bounded_lp.cli:main"

[tool.setuptools.packages.find]
include = ["bounded_lp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
