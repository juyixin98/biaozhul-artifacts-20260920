[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-matrix-service"
version = "0.1.0"
description = "Exact rational linear-equation and rank service with fraction-free (Bareiss) elimination, digit budgets and diagnosable progress"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "mpmath>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
rational-svc-replay = "rationalsvc.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
