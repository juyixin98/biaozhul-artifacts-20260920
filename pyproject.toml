[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "did-panel-service"
version = "1.0.0"
description = "Backend service for two-group two-period DID and event-time descriptive synthesis of panel data"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "numpy==2.4.6",
    "scipy==1.15.3",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov==7.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["app/main.py"]
