[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-pipeline"
version = "0.1.0"
description = "Local fit-on-train feature-transformation pipeline (standardize, categorical encode, impute) with NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
feature-pipeline = "feature_pipeline.service:main"

[tool.setuptools]
packages = ["feature_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["feature_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
