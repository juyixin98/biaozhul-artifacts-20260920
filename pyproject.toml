[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krylov-expm-service"
version = "0.1.0"
description = "Sparse exp(tA)v via Krylov subspace approximation, served over FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "scipy",
    "mpmath",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
