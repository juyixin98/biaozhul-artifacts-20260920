[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twosls-service"
version = "0.1.0"
description = "Synthetic linear-model 2SLS estimation service with weak-instrument diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "unit: kernel-level statistical unit tests",
  "identification: rank/order/weak-ID failure tests",
  "validation: boundary validation tests",
  "service: end-to-end service and API tests",
  "contract: statistical contract and assumption semantics",
  "reference: cross-checks against external mature implementations",
  "experiment: reproducible DGP experiment tests",
]

[tool.coverage.run]
source = ["app"]
