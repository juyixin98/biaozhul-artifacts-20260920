[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-mem-reuse"
version = "0.1.0"
description = "Restricted tensor graph memory-reuse planner and executor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.27,<1.0"]
test = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: small focused unit tests",
    "integration: multi-module integration tests",
    "e2e: end-to-end API/executor scenarios",
]
