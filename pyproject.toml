[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-size-planner"
version = "0.1.0"
description = "Backend for sample size planning for synthetic normal and binomial tests"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v"
markers = [
    "slow: simulation-heavy tests",
    "unit: isolated unit tests",
    "integration: end-to-end tests (API, SQLite, fixtures)",
]
