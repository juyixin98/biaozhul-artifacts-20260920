[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drain-planner"
version = "1.0.0"
description = "Local snapshot-based Kubernetes node drain planner and simulator (pure backend)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.6 still supports the httpx-based TestClient used by the tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
