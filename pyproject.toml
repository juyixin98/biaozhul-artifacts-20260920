[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-embedding-updater"
version = "1.0.0"
description = "Sparse gradient accumulation and optimizer service for large-vocabulary embedding tables"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v --strict-markers"
markers = [
    "numerical: cross-checks against the independent dense reference oracle",
]
