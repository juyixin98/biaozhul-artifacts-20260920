[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twosls-service"
version = "1.0.0"
description = "Synthetic 2SLS estimation service with weak-instrument and identification diagnostics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
oracle = ["linearmodels>=6.0"]

[project.scripts]
twosls-serve = "twosls.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = "tests"
markers = [
    "unit: kernel / math unit tests",
    "diagnostics: identification / weak-instrument diagnostics",
    "api: HTTP service integration tests",
    "replication: Monte-Carlo replication experiments",
    "oracle: comparisons against the optional linearmodels package",
]
addopts = "-ra"
