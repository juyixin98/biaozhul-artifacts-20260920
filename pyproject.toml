[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-shard"
version = "1.0.0"
description = "Local multi-process Adam state sharding with cross-process-count recovery"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "unit: fast, isolated unit tests",
  "integration: multi-process / end-to-end tests",
  "api: HTTP-level tests",
]

[tool.coverage.run]
source = ["src/adam_shard"]
branch = true
