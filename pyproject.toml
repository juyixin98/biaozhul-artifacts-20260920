[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradbucket"
version = "0.1.0"
description = "Teaching runtime for gradient bucketing and all-reduce in local synchronous SGD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["gradbucket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: 真实超时/真实多进程等较慢的端到端测试",
]

[tool.coverage.run]
branch = true
source = ["gradbucket"]
