[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-registration-backend"
version = "0.1.0"
description = "Point-to-point ICP rigid registration backend (synthetic/offline data only)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
