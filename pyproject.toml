[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-htn-planner"
version = "1.0.0"
description = "Finite HTN task planner with method selection, sequential/partial-order subtasks, evidence store and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: narrow unit tests (rule language, state)",
    "kernel: planner kernel behaviour",
    "integration: service + SQLite persistence",
    "e2e: HTTP end-to-end via FastAPI TestClient",
]
