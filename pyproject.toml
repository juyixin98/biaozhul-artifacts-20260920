[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blp"
version = "0.1.0"
description = "有界线性规划两阶段单纯形求解器（纯后端，NumPy）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
blp = "blp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

