[project]
name = "expression-taint-analysis"
version = "1.0.0"
description = "Static taint analysis HTTP service for a small scripting language (FastAPI + cryptography)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "cryptography==43.0.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.*",
    "httpx==0.27.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.language", "app.analysis"]
