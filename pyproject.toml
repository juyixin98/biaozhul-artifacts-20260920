[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudden-anomaly-detector"
version = "0.1.0"
description = "Causal sliding robust-statistics pulse anomaly detection on synthetic or PCM signals (offline, backend only)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
sudden-anomaly = "sudden_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
