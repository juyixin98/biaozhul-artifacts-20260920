[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sym-eig-service"
version = "1.0.0"
description = "Symmetric real-matrix eigendecomposition backend (Householder + implicit Wilkinson QR)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "mpmath>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sym_eig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
