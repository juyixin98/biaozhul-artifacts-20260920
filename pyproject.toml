[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-chain-audit"
version = "1.0.0"
description = "Sensor extrinsics chain checker: SE(3) covariance propagation, loop-closure audit and Monte Carlo verification"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "numpy==2.5.3",
    "PyYAML==6.0.3",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
