services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synapticgo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synapticgo"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${DB_PORT:-15433}:5432"

  app:
    build: .
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/synapticgo?sslmode=disable
      DATA_DIR: /data
    volumes:
      - appdata:/data
    ports:
      - "${APP_PORT:-18081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
