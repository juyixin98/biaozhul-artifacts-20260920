---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-controller
  namespace: quota-system
  labels:
    app.kubernetes.io/name: quota-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quota-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quota-controller
    spec:
      serviceAccountName: quota-controller
      containers:
        - name: manager
          image: docker.io/library/quota-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8080
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: quota-webhook-tls
