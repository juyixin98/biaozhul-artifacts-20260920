---
apiVersion: v1
kind: Namespace
metadata:
  name: timer-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timer-webhook
  namespace: timer-system
  labels:
    app: timer-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timer-webhook
  template:
    metadata:
      labels:
        app: timer-webhook
    spec:
      containers:
        - name: webhook
          image: timer-webhook:dev
          imagePullPolicy: IfNotPresent
          args:
            - --port=9443
            - --tls-cert-file=/tmp/k8s-webhook-server/serving-certs/tls.crt
            - --tls-key-file=/tmp/k8s-webhook-server/serving-certs/tls.key
          ports:
            - containerPort: 9443
              name: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: timer-webhook
  namespace: timer-system
spec:
  selector:
    app: timer-webhook
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
