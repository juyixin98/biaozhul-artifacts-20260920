---
# ServiceAccount + binding for the controller manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-controller-manager
  namespace: snapshot-system
  labels:
    app.kubernetes.io/name: snapshot-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snapshot-manager-rolebinding
  labels:
    app.kubernetes.io/name: snapshot-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshot-manager-role
subjects:
  - kind: ServiceAccount
    name: snapshot-controller-manager
    namespace: snapshot-system
