---
apiVersion: v1
kind: Pod
metadata:
  name: workload-normal
  namespace: quota-demo
  labels:
    quota.example.com/claim: claim-normal
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: "400m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
