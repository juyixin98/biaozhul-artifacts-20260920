# A pod that consumes the "example" reservation. The admission webhook only
# admits it while the request is Reserved and unexpired, and the pod's
# resource requests must equal the reservation exactly.
apiVersion: v1
kind: Pod
metadata:
  name: example
  namespace: demo-quota
  labels:
    quota.biaozhu.dev/request: example
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
