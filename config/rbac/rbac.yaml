apiVersion: v1
kind: Namespace
metadata:
  name: cert-renewal-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-renewal-coordinator
  namespace: cert-renewal-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-renewal-coordinator
rules:
  - apiGroups: ["coordinator.example.com"]
    resources: ["certificates", "certificaterequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordinator.example.com"]
    resources: ["certificates/status", "certificaterequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-renewal-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-renewal-coordinator
subjects:
  - kind: ServiceAccount
    name: cert-renewal-coordinator
    namespace: cert-renewal-system
