---
apiVersion: v1
kind: Namespace
metadata:
  name: quota-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quota-controller
  namespace: quota-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quota-controller-role
rules:
  - apiGroups: ["quota.example.com"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["quota.example.com"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["quota.example.com"]
    resources: ["resourceclaims/finalizers"]
    verbs: ["update"]
  - apiGroups: ["quota.example.com"]
    resources: ["reservationpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["quota.example.com"]
    resources: ["reservationpools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quota-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quota-controller-role
subjects:
  - kind: ServiceAccount
    name: quota-controller
    namespace: quota-system
---
apiVersion: v1
kind: Service
metadata:
  name: quota-webhook-service
  namespace: quota-system
spec:
  selector:
    app.kubernetes.io/name: quota-controller
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
