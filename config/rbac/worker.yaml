apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-worker
  namespace: default
---
# The worker Job mounts a source ConfigMap and publishes a result ConfigMap
# through the real Kubernetes API. It needs no access to Snapshot objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-worker
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-worker
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-worker
subjects:
  - kind: ServiceAccount
    name: snapshot-worker
    namespace: default
