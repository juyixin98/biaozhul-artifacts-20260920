apiVersion: v1
kind: ServiceAccount
metadata:
  name: quota-reserver-controller-manager
  namespace: quota-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quota-reserver-manager
rules:
  # ResourceRequest lifecycle
  - apiGroups: ["quota.biaozhu.dev"]
    resources: ["resourcerequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["quota.biaozhu.dev"]
    resources: ["resourcerequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["quota.biaozhu.dev"]
    resources: ["resourcerequests/finalizers"]
    verbs: ["update"]
  # QuotaPool ledger
  - apiGroups: ["quota.biaozhu.dev"]
    resources: ["quotapools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["quota.biaozhu.dev"]
    resources: ["quotapools/status"]
    verbs: ["get", "update", "patch"]
  # Late-pod sweeping and bound-pod observation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Webhook PKI provisioning
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quota-reserver-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quota-reserver-manager
subjects:
  - kind: ServiceAccount
    name: quota-reserver-controller-manager
    namespace: quota-system
