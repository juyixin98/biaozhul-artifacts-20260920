apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.coordinator.example.com
spec:
  group: coordinator.example.com
  scope: Namespaced
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
    shortNames: [cert]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Secret
          type: string
          jsonPath: .spec.secretName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: NotAfter
          type: string
          jsonPath: .status.notAfter
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Certificate declares a TLS certificate that is continuously kept valid by the renewal coordinator.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [dnsNames, secretName, issuerRef]
              properties:
                dnsNames:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                commonName:
                  type: string
                duration:
                  type: string
                  description: Go duration, e.g. "24h". Defaults to 24h, minimum 10m.
                renewBefore:
                  type: string
                  description: Go duration, must be smaller than duration. Defaults to duration/3.
                secretName:
                  type: string
                  minLength: 1
                issuerRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                serialNumber:
                  type: string
                specHash:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
