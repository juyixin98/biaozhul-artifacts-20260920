---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: failpolicies.chaos.example.com
spec:
  group: chaos.example.com
  scope: Cluster
  names:
    kind: FailPolicy
    listKind: FailPolicyList
    plural: failpolicies
    singular: failpolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [mode]
              properties:
                targetNamespaces:
                  type: array
                  items:
                    type: string
                namespaceSelector:
                  type: object
                  additionalProperties:
                    type: string
                actions:
                  type: array
                  items:
                    type: string
                    enum: [CREATE, UPDATE, DELETE]
                objectNameSubstring:
                  type: string
                mode:
                  type: string
                  enum: [Always, FirstN]
                firstN:
                  type: integer
                  format: int32
                  minimum: 0
                message:
                  type: string
