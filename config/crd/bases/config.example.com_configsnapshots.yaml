---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configsnapshots.config.example.com
spec:
  group: config.example.com
  scope: Cluster
  names:
    kind: ConfigSnapshot
    listKind: ConfigSnapshotList
    plural: configsnapshots
    singular: configsnapshot
