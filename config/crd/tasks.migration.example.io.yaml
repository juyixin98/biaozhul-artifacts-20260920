# Task CRD: v1alpha1 (served) + v1 (served AND storage), conversion webhook.
#
# Unknown-field policy (explicit, per task requirement):
#   * spec.x-kubernetes-preserve-unknown-fields: true is set on BOTH versions.
#     This is a deliberate, schema-declared decision: fields that neither
#     version models are carried through conversion verbatim rather than
#     pruned. The cost is that typos in spec are not rejected; that trade-off
#     is documented in docs/roundtrip-strategy.md.
#   * metadata/annotations are always preserved by the API machinery.
#   * The conversion webhook additionally merges unknown keys in memory, so
#     preservation does not depend on this flag alone (defence in depth).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.migration.example.io
spec:
  group: migration.example.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  # v1 is the storage version. Existing v1alpha1 objects are rewritten by
  # cmd/storage-migrate after rollout.
  preserveUnknownFields: false
  conversion:
    strategy: Webhook
    # The API server calls the webhook when serving a version that differs
    # from what is stored. failurePolicy: Fail means a webhook outage or an
    # inexpressible value is reported to the client, never papered over.
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          name: task-webhook
          namespace: task-system
          path: /convert
          port: 443
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # Explicit unknown-field retention policy, legacy version.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                timeoutSeconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 315576000000
                  description: Whole-second timeout. Defaulted to 30 on create.
                payload:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                retries:
                  type: integer
                  format: int32
                message:
                  type: string
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # Explicit unknown-field retention policy, storage version.
              x-kubernetes-preserve-unknown-fields: true
              required: ["timeout"]
              properties:
                timeout:
                  type: object
                  required: ["seconds"]
                  properties:
                    seconds:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 315576000000
                    nanos:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 999999999
                      description: |
                        Sub-second offset. Non-zero nanos cannot be represented
                        in v1alpha1; the conversion webhook rejects such values
                        with InexpressibleValue rather than truncating.
                payload:
                  type: string
                priority:
                  type: string
                  enum: ["Normal", "High", "Low"]
                  default: "Normal"
                tags:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                retries:
                  type: integer
                  format: int32
                message:
                  type: string
