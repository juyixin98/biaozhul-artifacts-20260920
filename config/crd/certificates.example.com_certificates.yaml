---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.certificates.example.com
spec:
  group: certificates.example.com
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Serial
          type: string
          jsonPath: .status.serial
        - name: NotAfter
          type: date
          jsonPath: .status.notAfter
        - name: RenewalTime
          type: date
          jsonPath: .status.renewalTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: Certificate is a locally issued TLS certificate renewed by the controller.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [dnsNames, secretName, issuer]
              properties:
                dnsNames:
                  type: array
                  minItems: 1
                  items:
                    type: string
                secretName:
                  type: string
                  minLength: 1
                duration:
                  type: string
                  description: "Requested validity, e.g. 24h / 30m. Default 24h; minimum 10m."
                renewBefore:
                  type: string
                  description: "Renew this long before NotAfter. Defaults to 1/3 of duration."
                issuer:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                notBefore:
                  type: string
                  format: date-time
                notAfter:
                  type: string
                  format: date-time
                serial:
                  type: string
                thumbprint:
                  type: string
                specHash:
                  type: string
                currentSecret:
                  type: string
                renewalTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
