metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: reservationpools.quota.example.com
spec:
  group: quota.example.com
  names:
    kind: ReservationPool
    listKind: ReservationPoolList
    plural: reservationpools
    shortNames:
    - rpool
    singular: reservationpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cpuCapacity
      name: CPUCap
      type: string
    - jsonPath: .spec.memoryCapacity
      name: MemCap
      type: string
    - jsonPath: .status.reservedCPU
      name: CPUUsed
      type: string
    - jsonPath: .status.reservedMemory
      name: MemUsed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ReservationPool is the per-namespace capacity ledger.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PoolSpec defines the total capacity that can be reserved
              in a namespace.
            properties:
              cpuCapacity:
                description: CPUCapacity is the total milli-cpu budget, e.g. "8000m".
                type: string
              memoryCapacity:
                description: MemoryCapacity is the total memory budget, e.g. "16Gi".
                type: string
            required:
