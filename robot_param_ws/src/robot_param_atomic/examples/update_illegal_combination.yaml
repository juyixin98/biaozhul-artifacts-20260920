# Each individual value passes its per-field range check:
#   sample_rate_hz   = 1000   (> 0, legal)
#   buffer_length    = 100    (> 0, legal)
#   allowed_latency  = 100 ms (> 0, legal)
# but the COMBINATION violates the cross-field invariant:
#   buffer covers 100/1000*1000 = 100 ms, required 2*100 = 200 ms.
# The whole batch is rejected (all-or-nothing); the version stays at 0.
expected_version: 0
set_sample_rate: true
sample_rate_hz: 1000.0
set_buffer_length: true
buffer_length: 100
set_allowed_latency: true
allowed_latency_ms: 100

# Expected response:
# status=1 (REJECTED_VALIDATION)
# message='cross-field constraint violated: buffer covers 100.000 ms but must
#  cover at least 2 * allowed_latency_ms = 200.000 ms (...)'
# version=0 and all fields unchanged.
