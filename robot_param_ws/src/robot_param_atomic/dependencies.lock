# Transitive ROS packages that must be present (pulled in automatically by the
# above): rosidl-typesupport-fastrtps-cpp, rmw-cyclonedds/fastrtps,
# rcl-interfaces, example-interfaces, ament-cmake-ros.
#
# SQLite interface used: raw C API (sqlite3.h), single append-only table
#   config_commits(id, version, sampling_rate_hz, cache_length_s,
#                  allowed_latency_s, hash, created_at)
# Crypto interface used: OpenSSL 3 EVP_Q_digest("SHA256", ...).
