services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://workflow:workflow@db:5432/workflow
      ENABLE_SWEEPER: "true"
      SWEEP_INTERVAL_SECONDS: "5"
      SEED_DEMO_ON_START: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
