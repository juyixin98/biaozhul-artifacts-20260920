services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careforce
      POSTGRES_PASSWORD: careforce
      POSTGRES_DB: careforce
    ports:
      - "5432:5432"
    volumes:
      - careforce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careforce -d careforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://careforce:careforce@db:5432/careforce
      RUN_SEED: "true"
    ports:
      - "8000:8000"

volumes:
  careforce_pgdata:
