version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platform/migrate/sqlfiles"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
