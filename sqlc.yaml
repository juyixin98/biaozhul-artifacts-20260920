version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/migrate/sql/0001_init.up.sql
    queries: internal/sqlc/queries.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
