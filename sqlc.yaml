version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "user_role"
            go_type: "string"
          - db_type: "content_status"
            go_type: "string"
          - db_type: "moderation_state"
            go_type: "string"
