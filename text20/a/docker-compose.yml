services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalboard
      POSTGRES_PASSWORD: signalboard
      POSTGRES_DB: signalboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalboard -d signalboard"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    image: signalboard:latest
    # The server embeds migrations and applies them on startup.
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://signalboard:signalboard@db:5432/signalboard?sslmode=disable"
      ADMIN_TOKEN: "dev-admin-token"
      SCREEN_OFFLINE_AFTER: "90s"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-off demo data loader. It is idempotent and exits when finished.
  # Run with:  docker compose --profile seed run --rm seed
  seed:
    image: signalboard:latest
    profiles: ["seed"]
    entrypoint: ["/usr/local/bin/signalboard-seed"]
    environment:
      DATABASE_URL: "postgres://signalboard:signalboard@db:5432/signalboard?sslmode=disable"
      ADMIN_TOKEN: "dev-admin-token"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
