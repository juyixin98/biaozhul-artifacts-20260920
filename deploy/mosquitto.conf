# MQTT会话重投递项目专用 broker（容器内监听 1883，映射到宿主机 11883）
# 兼容 Mosquitto 2.0/2.1。
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
log_type error
log_type warning
log_type notice
max_inflight_messages 0
max_queued_messages 100000
# 按 MQTT 规范，保留消息只在"建立新订阅"时下发一次，不会在持久会话
# 重连时反复重放；订阅端用 RetainHandling=1（仅首次订阅接收快照）。
