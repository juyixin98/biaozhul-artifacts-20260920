name: communityvault

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: communityvault
    # Host port overridable to avoid clashes on shared machines:
    #   DB_PORT=5450 docker compose up
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d communityvault"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://community:community@db:5432/communityvault?sslmode=disable
      HTTP_ADDR: ":8080"
      # Short TTL keeps the claim-timeout demo and tests fast.
      CLAIM_TTL_SECONDS: "30"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
