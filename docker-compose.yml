services:
  postgres:
    image: postgres:16-alpine
    container_name: deadlock-pg
    environment:
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: deadlock
      POSTGRES_DB: deadlock
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock"]
      interval: 2s
      timeout: 3s
      retries: 20
