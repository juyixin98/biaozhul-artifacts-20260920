services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalboard
      POSTGRES_PASSWORD: signalboard
      POSTGRES_DB: signalboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalboard"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://signalboard:signalboard@db:5432/signalboard?sslmode=disable
      PORT: "8080"
      ADMIN_TOKEN: dev-admin-token
    ports:
      - "8123:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
