services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: costlens
      POSTGRES_PASSWORD: costlens
      POSTGRES_DB: costlens
    ports:
      - "${COSTLENS_DB_PORT:-55432}:5432"
    volumes:
      - costlens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costlens -d costlens"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      COSTLENS_DATABASE_URL: postgres://costlens:costlens@db:5432/costlens?sslmode=disable
      COSTLENS_HTTP_ADDR: ":8080"
    ports:
      - "${COSTLENS_HTTP_PORT:-8080}:8080"

  # One-off: docker compose run --rm seed
  seed:
    build: .
    entrypoint: ["/usr/local/bin/costlens-seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      COSTLENS_DATABASE_URL: postgres://costlens:costlens@db:5432/costlens?sslmode=disable
    profiles: ["tools"]

volumes:
  costlens_pg:
