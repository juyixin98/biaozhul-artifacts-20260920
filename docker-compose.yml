services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dams
      POSTGRES_PASSWORD: dams
      POSTGRES_DB: dams
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dams -d dams"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dams-pgdata:/var/lib/postgresql/data

  dams:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAMS_DATABASE_URL: postgres://dams:dams@postgres:5432/dams?sslmode=disable
      DAMS_HTTP_ADDR: ":8080"
      DAMS_MIGRATE_ON_START: "true"
    ports:
      - "${DAMS_HTTP_PORT:-18080}:8080"

  # One-shot seeder: prints bearer tokens, then exits.
  # Run: docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/damsctl", "seed", "-replace"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAMS_DATABASE_URL: postgres://dams:dams@postgres:5432/dams?sslmode=disable

volumes:
  dams-pgdata:
