name: cloudgate-text12-a

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudgate
      POSTGRES_PASSWORD: cloudgate
      POSTGRES_DB: cloudgate
    ports:
      - "15499:5432"
    volumes:
      - cloudgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudgate"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLOUDGATE_DATABASE_URL: postgresql+psycopg2://cloudgate:cloudgate@db:5432/cloudgate
      CLOUDGATE_TOKEN_SECRET: cloudgate-compose-demo-secret
      CLOUDGATE_SUPER_ADMIN_KEY: super-admin-key
      CLOUDGATE_HEARTBEAT_TTL_SECONDS: "600"
      CLOUDGATE_HEARTBEAT_INTERVAL_SECONDS: "60"
      CLOUDGATE_SWEEPER_INTERVAL_SECONDS: "5"
    ports:
      - "18099:8000"

volumes:
  cloudgate_pgdata:
