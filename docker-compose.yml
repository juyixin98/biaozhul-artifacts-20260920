services:
  postgres:
    image: postgres:16-alpine
    container_name: twap-postgres
    environment:
      POSTGRES_USER: twap
      POSTGRES_PASSWORD: twap
      POSTGRES_DB: twap
    ports:
      - "55432:5432"
    volumes:
      - twap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twap -d twap"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  twap_pgdata:
