name: fieldsnap-text28b

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fieldsnap}
      MYSQL_USER: ${DB_USER:-fieldsnap}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fieldsnap_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    environment:
      USE_SQLITE: "0"
      DB_NAME: ${DB_NAME:-fieldsnap}
      DB_USER: ${DB_USER:-fieldsnap}
      DB_PASSWORD: ${DB_PASSWORD:-fieldsnap_pass}
      DB_HOST: db
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_SEED_DEMO: ${DJANGO_SEED_DEMO:-1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
