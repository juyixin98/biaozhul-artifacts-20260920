services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapticgo
      POSTGRES_PASSWORD: synapticgo
      POSTGRES_DB: synapticgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapticgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYN_HTTP_ADDR: ":8080"
      SYN_DATABASE_URL: "postgres://synapticgo:synapticgo@db:5432/synapticgo?sslmode=disable"
      SYN_DATA_DIR: "/data"
    ports:
      - "8080:8080"
    volumes:
      - blobdata:/data

volumes:
  pgdata:
  blobdata:
