# Local progressive-rollout decision backend.
# Brings up PostgreSQL, the deterministic metrics stub and the decision server.
#
# Published host ports are overridable to avoid clashes on a shared machine:
#   PG_PORT=55444 STUB_PORT=18081 HTTP_PORT=18080 docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rollout
      POSTGRES_PASSWORD: rollout
      POSTGRES_DB: rollout
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollout -d rollout"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rollout_pgdata:/var/lib/postgresql/data

  stub:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/stub", "-addr", ":8081"]
    ports:
      - "${STUB_PORT:-8081}:8081"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/server"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://rollout:rollout@postgres:5432/rollout?sslmode=disable"
      STUB_URL: "http://stub:8081"
      HMAC_KEY_ID: "local-dev-key"
      HMAC_SECRET: "dev-shared-secret-change-me"
      OBSERVATION_MS: "1200"
      MIN_SAMPLES: "80"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      stub:
        condition: service_started

volumes:
  rollout_pgdata:
