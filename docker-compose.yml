name: clearsettle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clearsettle
      POSTGRES_PASSWORD: clearsettle
      POSTGRES_DB: clearsettle
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearsettle"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      CLEARSETTLE_DATABASE_URL: postgres://clearsettle:clearsettle@postgres:5432/clearsettle?sslmode=disable
      CLEARSETTLE_HTTP_ADDR: ":8080"
      CLEARSETTLE_SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
