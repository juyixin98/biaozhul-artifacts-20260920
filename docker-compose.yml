name: activityguard

services:
  mysql:
    image: mysql:8.4
    container_name: activityguard-mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-activityguard}
      MYSQL_USER: ${MYSQL_USER:-guard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-guardpw_change_me}
    ports:
      # 仅绑定到本机回环地址
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - activityguard-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpw_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    container_name: activityguard-api
    environment:
      APP_HTTP_ADDR: ":8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-activityguard}
      DB_USER: ${MYSQL_USER:-guard}
      DB_PASSWORD: ${MYSQL_PASSWORD:-guardpw_change_me}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      JWT_TTL: ${JWT_TTL:-12h}
      BACKFILL_WINDOW: ${BACKFILL_WINDOW:-720h}
      FUTURE_SKEW: ${FUTURE_SKEW:-5m}
      BATCH_MAX_EVENTS: ${BATCH_MAX_EVENTS:-2000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  activityguard-mysql-data:
