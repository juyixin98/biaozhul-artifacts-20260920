services:
  mysql:
    image: mysql:8.4
    container_name: anomalywatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootlocal
      MYSQL_DATABASE: anomalywatch
      MYSQL_USER: anomaly
      MYSQL_PASSWORD: anomaly
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:13323:3306"
    volumes:
      - anomalywatch_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootlocal"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anomalywatch-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: anomaly
      DB_PASSWORD: anomaly
      DB_NAME: anomalywatch
      ADMIN_API_KEY: admin-local-key
      ANALYST_API_KEY: analyst-local-key
      # Local-only deployment; keep scheduling explicit.
      PROCESS_INTERVAL: 5s
      SWEEP_INTERVAL: 1h
      ESCALATE_INTERVAL: 1m
      TZ: UTC
    ports:
      - "18023:8080"

volumes:
  anomalywatch_mysql:
