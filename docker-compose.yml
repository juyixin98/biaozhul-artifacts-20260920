# Local domain lifecycle engine — full stack: PostgreSQL + API/worker.
# No real registrar, DNS or payment service is involved.
name: domainengine

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domain
      POSTGRES_PASSWORD: domain
      POSTGRES_DB: domain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain -d domain"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No host port published by default: the API talks to the database over the
    # Compose network. To inspect the DB from the host, uncomment:
    # ports: ["5433:5432"]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://domain:domain@db:5432/domain?sslmode=disable
      HTTP_ADDR: ":8080"
      # 32-byte AES-256 key as 64 hex chars. Override in any real deployment.
      CODEC_KEY_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      SWEEP_INTERVAL: "10s"
      POLL_INTERVAL: "5s"
      # Lifecycle durations (Go duration syntax):
      APPROVAL_WINDOW: "120h"      # 5 days seller approval window
      EXPIRED_GRACE: "0s"
      REDEEM_PERIOD: "720h"        # 30 days redemption grace
      PENDING_DELETE: "120h"       # 5 days pending delete before release
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
