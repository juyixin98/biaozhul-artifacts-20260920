name: meridian-travelops

services:
  db:
    image: mysql:8.4
    command: --default-time-zone=+00:00 --innodb-flush-log-at-trx-commit=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-travelops}
      MYSQL_DATABASE: ${DB_NAME:-travelops}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-travelops}"]
      interval: 3s
      timeout: 3s
      retries: 40
    # DB port intentionally not published: the app talks to `db` over the
    # compose network. Publish it yourself (ports:) if you need host access.

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-travelops}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-travelops}
      SEED_ON_START: "1"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./:/var/www

volumes:
  db_data:
