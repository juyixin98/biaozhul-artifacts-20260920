services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sircc
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sircc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sircc -d sircc"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${SIRCC_DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://sircc:postgres@db:5432/sircc?sslmode=disable
      ADDR: :8080
      REMINDER_INTERVAL: 5s
    ports:
      - "${SIRCC_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Integration tests: docker compose --profile test run --rm test
  test:
    image: golang:1.22-bookworm
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://sircc:postgres@db:5432/sircc?sslmode=disable
      GOTOOLCHAIN: local
    command: go test ./...
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  gomodcache:
