name: sircc

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sircc
      POSTGRES_PASSWORD: sircc
      POSTGRES_DB: sircc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sircc -d sircc"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: sircc-api:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sircc:sircc@db:5432/sircc?sslmode=disable
      ADDR: :8080
      REMINDER_INTERVAL: 5s
    ports:
      - "18082:8080"

volumes:
  db-data:
