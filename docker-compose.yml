services:
  postgres:
    image: postgres:16-alpine
    container_name: deadlock-pg
    environment:
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: deadlock_pw_068
      POSTGRES_DB: deadlock_db
    ports:
      - "5432:5432"
    volumes:
      - deadlock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlock -d deadlock_db"]
      interval: 1s
      timeout: 3s
      retries: 20

volumes:
  deadlock_pgdata:
