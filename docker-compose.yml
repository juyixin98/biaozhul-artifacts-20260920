services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudgate
      POSTGRES_PASSWORD: cloudgate
      POSTGRES_DB: cloudgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudgate -d cloudgate"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      CLOUDGATE_DATABASE_URL: postgresql+psycopg2://cloudgate:cloudgate@db:5432/cloudgate
      CLOUDGATE_JWT_SECRET: change-me-in-production
      CLOUDGATE_ADMIN_USERNAME: admin
      CLOUDGATE_ADMIN_PASSWORD: admin123
      CLOUDGATE_HEARTBEAT_INTERVAL_SECONDS: "60"
      CLOUDGATE_LEASE_TTL_SECONDS: "600"
      CLOUDGATE_SWEEP_INTERVAL_SECONDS: "30"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
