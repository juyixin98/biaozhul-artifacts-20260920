name: revstream-text25a

# All services share the host network to avoid consuming scarce user-defined
# bridge subnets on heavily-used dev machines. MySQL listens on
# 127.0.0.1:${MYSQL_PORT:-3325}; the app connects via MYSQL_HOST=127.0.0.1.
services:
  db:
    image: mysql:8.0
    network_mode: host
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --port=${MYSQL_PORT:-3325}
      - --mysqlx=0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-revstream}
      MYSQL_USER: ${MYSQL_USER:-revstream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-revstream}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - revstream_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -P ${MYSQL_PORT:-3325} -prootpassword"
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    network_mode: host
    environment:
      ROLE: web
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: ${MYSQL_PORT:-3325}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-revstream}
      MYSQL_USER: ${MYSQL_USER:-revstream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-revstream}
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-1}
      WEB_PORT: ${WEB_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    network_mode: host
    environment:
      ROLE: scheduler
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: ${MYSQL_PORT:-3325}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-revstream}
      MYSQL_USER: ${MYSQL_USER:-revstream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-revstream}
      SCORING_INTERVAL_MINUTES: ${SCORING_INTERVAL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  revstream_mysql_data:
