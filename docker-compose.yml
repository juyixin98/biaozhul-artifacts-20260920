name: proofcycle

services:
  db:
    image: mysql:8.4
    command:
      - --innodb-use-native-aio=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proofcycle}
      MYSQL_USER: ${MYSQL_USER:-proofcycle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-proofcycle}
    volumes:
      - proofcycle-mysql:/var/lib/mysql
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_PORT:-3306}:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROOFCYCLE_HTTP_ADDR: ":8080"
      MYSQL_HOST: "db"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proofcycle}
      MYSQL_USER: ${MYSQL_USER:-proofcycle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-proofcycle}
      PROOFCYCLE_STORAGE_ROOT: "/data/files"
      PROOFCYCLE_AUTO_MIGRATE: "true"
      PROOFCYCLE_SEED: "true"
      PROOFCYCLE_MAX_UPLOAD_BYTES: "20971520"
    volumes:
      - proofcycle-files:/data/files
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  proofcycle-mysql:
  proofcycle-files:
