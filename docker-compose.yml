name: careops

services:
  db:
    image: mysql:8.0
    container_name: careops-db
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: careops_pw
      MYSQL_DATABASE: careops
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcareops_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: careops-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: careops
      DB_USER: root
      DB_PASSWORD: careops_pw
      PORT: 3000
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    ports:
      - "3000:3000"

volumes:
  db_data:
