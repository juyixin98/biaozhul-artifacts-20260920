services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --innodb-fast-shutdown=1
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: geoterritory
      MYSQL_USER: geoterritory
      MYSQL_PASSWORD: geoterritory
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "geoterritory"
      MYSQL_PASSWORD: "geoterritory"
      MYSQL_DATABASE: "geoterritory"
      SEED_SAMPLES: "true"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
