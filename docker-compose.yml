services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desklens
      POSTGRES_PASSWORD: desklens
      POSTGRES_DB: desklens
    ports:
      - "5432:5432"
    volumes:
      - desklens-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desklens -d desklens"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://desklens:desklens@db:5432/desklens?sslmode=disable"
      ADMIN_API_KEY: "admin-dev-key"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  desklens-pg:
