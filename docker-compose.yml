services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillpulse
      POSTGRES_PASSWORD: skillpulse
      POSTGRES_DB: skillpulse
    ports:
      - "55432:5432"
    volumes:
      - skillpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://skillpulse:skillpulse@db:5432/skillpulse
      SEED_DEMO_DATA: "true"
      ENABLE_SWEEPER: "true"
    ports:
      - "8099:8000"

volumes:
  skillpulse_pgdata:
