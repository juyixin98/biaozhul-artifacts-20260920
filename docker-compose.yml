name: nnlab-text13a

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
      POSTGRES_DB: nn_training
    # DB is only reached by the app over the compose network; no host port
    # is published (avoids clashing with a local PostgreSQL).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d nn_training"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: nnlab-text13a-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://trainer:trainer@db:5432/nn_training
      DATA_WHITELIST_DIRS: /data
      CHECKPOINT_DIR: /checkpoints
      LEADER_LEASE_SECONDS: "30"
      WORKER_ENABLED: "1"
    ports:
      - "18017:8000"
    volumes:
      - ./data:/data:ro
      - ckpt:/checkpoints

volumes:
  pgdata:
  ckpt:
