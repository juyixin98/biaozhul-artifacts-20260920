services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalboard
      POSTGRES_PASSWORD: signalboard
      POSTGRES_DB: signalboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalboard"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${DB_PORT:-15432}:5432" # host port only for local tools; the app uses the internal network
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://signalboard:signalboard@db:5432/signalboard?sslmode=disable
      ADDR: :8080
      SEED_DEMO: "true" # loads demo store/menu/screen and logs the screen token
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
