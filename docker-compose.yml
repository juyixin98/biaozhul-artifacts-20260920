services:
  postgres:
    image: postgres:16-alpine
    container_name: revcred-postgres
    environment:
      POSTGRES_USER: revcred
      POSTGRES_PASSWORD: revcred
      POSTGRES_DB: revcred
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revcred -d revcred"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
