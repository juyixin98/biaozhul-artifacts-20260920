services:
  mysql:
    image: mysql:8.4
    container_name: itasset-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: itasset
      MYSQL_USER: itasset
      MYSQL_PASSWORD: itasset
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=REPEATABLE-READ
      - --innodb-lock-wait-timeout=10
      - --log-bin-trust-function-creators=1
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pitasset"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: itasset-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: itasset
      DB_USER: itasset
      DB_PASSWORD: itasset
    ports:
      - "18088:8080"

volumes:
  mysql-data:
