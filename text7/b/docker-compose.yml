services:
  mysql:
    image: mysql:8.4
    container_name: asset-mysql
    environment:
      MYSQL_DATABASE: assetdb
      MYSQL_USER: asset
      MYSQL_PASSWORD: asset123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uasset", "-passet123"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: asset-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/assetdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USER: asset
      DB_PASSWORD: asset123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
