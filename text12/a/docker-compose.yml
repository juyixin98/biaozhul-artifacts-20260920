name: cloudgate-text12-a

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudgate
      POSTGRES_PASSWORD: cloudgate
      POSTGRES_DB: cloudgate
    volumes:
      - cloudgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudgate -d cloudgate"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "15499:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLOUDGATE_DATABASE_URL: postgresql+psycopg2://cloudgate:cloudgate@db:5432/cloudgate
      # 生产部署务必通过 .env / 环境变量覆盖超级管理员密钥
      CLOUDGATE_SUPER_ADMIN_KEY: ${CLOUDGATE_SUPER_ADMIN_KEY:-dev-super-key-change-me}
      CLOUDGATE_HEARTBEAT_TIMEOUT_SECONDS: "600"
      CLOUDGATE_REAPER_INTERVAL_SECONDS: "30"
    ports:
      - "18099:8000"

volumes:
  cloudgate_pgdata:
