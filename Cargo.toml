[package]
name = "lsm-server"
version = "0.1.0"
edition = "2021"
description = "Simplified LSM storage service (memtable, immutable sorted segments, tombstones, atomic manifest)"

[lib]
name = "lsm_server"
path = "src/lib.rs"

[[bin]]
name = "lsm-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 教学/演示用途：体积优先
opt-level = 2
