[package]
name = "cow-snapshot"
version = "0.1.0"
edition = "2021"
description = "Page-level copy-on-write branching snapshot storage service (Axum)"

[lib]
name = "cow_snapshot"
path = "src/lib.rs"

[[bin]]
name = "cow-server"
path = "src/main.rs"

[[bin]]
name = "crash-driver"
path = "src/bin/crash-driver.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "unwind"
