[package]
name = "utxo-rollback"
version = "0.1.0"
edition = "2021"
description = "UTXO rollback validator for offline chain experiments (Axum + SQLite)"

[lib]
name = "utxo_rollback"
path = "src/lib.rs"

[[bin]]
name = "utxo-rollback"
path = "src/main.rs"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"
required-features = []

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
