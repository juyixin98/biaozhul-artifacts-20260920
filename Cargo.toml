[package]
name = "disk-bptree"
version = "0.1.0"
edition = "2021"
description = "磁盘页式 B+ 树整数键索引服务（Axum HTTP 接口）"

[lib]
name = "disk_bptree"
path = "src/lib.rs"

[[bin]]
name = "bptree-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http = "1"
rand = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
