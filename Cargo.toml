[package]
name = "build-provenance-verify"
version = "0.1.0"
edition = "2021"
description = "SLSA-style build provenance verification HTTP service (Axum, Ed25519-signed statements)"

[lib]
name = "build_provenance_verify"
path = "src/lib.rs"

[[bin]]
name = "provenance-server"
path = "src/main.rs"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen-fixtures.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
