[package]
name = "interval-lock-server"
version = "0.1.0"
edition = "2021"
description = "Transactional interval lock service with wait-queue and deadlock detection (HTTP API, axum)"

[lib]
name = "interval_lock"
path = "src/lib.rs"

[[bin]]
name = "interval-lock-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
