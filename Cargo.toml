[package]
name = "relay-coord"
version = "0.1.0"
edition = "2021"
description = "中继租约与序号协调服务：fencing token、每通道 nonce 顺序、目标链桩"

[lib]
name = "relay_coord"
path = "src/lib.rs"

[[bin]]
name = "coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "target-stub"
path = "src/bin/target_stub.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"

[profile.release]
lto = "thin"
