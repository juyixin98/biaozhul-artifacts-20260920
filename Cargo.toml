[package]
name = "depsolver"
version = "0.1.0"
edition = "2021"
description = "Small backtracking package dependency resolution service (SemVer ranges, optional deps, platform conditions)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
