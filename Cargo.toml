[package]
name = "versioned-gas-meter"
version = "0.1.0"
edition = "2021"
description = "离线 WASM 沙箱与版本化 Gas 计量器（Wasmtime + Axum）"
license = "MIT"

[dependencies]
wasmtime = { version = "24", default-features = false, features = ["cranelift", "runtime", "std"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
wat = "1"

[build-dependencies]
wat = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
sha2 = "0.10"

[[bin]]
name = "gas-meter"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
