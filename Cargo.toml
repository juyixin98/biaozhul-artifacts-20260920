[package]
name = "repro-pack"
version = "0.1.0"
edition = "2021"
description = "Deterministic (reproducible) artifact packaging service over HTTP"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tar = "0.4"

[profile.release]
opt-level = 2
