[package]
name = "mvcc-kv"
version = "0.1.0"
edition = "2021"
description = "Single-process MVCC key-value service with snapshot reads, tombstones and version reclamation"

[dependencies]
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "mvcc-kv"
path = "src/main.rs"
