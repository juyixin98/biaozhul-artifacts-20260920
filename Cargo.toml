[package]
name = "decorrelate"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Decorrelation compilation and execution service for EXISTS / NOT EXISTS / scalar aggregate subqueries"
license = "MIT"

[[bin]]
name = "decorrelate-server"
path = "src/main.rs"

[lib]
name = "decorrelate"
path = "src/lib.rs"

[dependencies]
arrow2 = { version = "=0.18.0", features = ["io_json"] }
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["full"] }
tower = "=0.5.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
