[package]
name = "leapfrog-tj"
version = "0.1.0"
edition = "2021"
description = "Leapfrog Triejoin backend for restricted multi-way natural joins (Rust + Axum + Arrow2)"

[lib]
name = "leapfrog_tj"
path = "src/lib.rs"

[[bin]]
name = "leapfrog-tj"
path = "src/main.rs"

[dependencies]
arrow2 = { version = "0.18", features = ["io_ipc"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
