[package]
name = "manifest-selector"
version = "0.1.0"
edition = "2021"
description = "OCI-style multi-arch manifest index selection service (Axum, offline)"

[lib]
name = "manifest_selector"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower = { version = "0.5", features = ["limit", "util"] }

[dev-dependencies]

[[bin]]
name = "manifest-selector"
path = "src/main.rs"
