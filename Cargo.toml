[package]
name = "serial-replay"
version = "0.1.0"
edition = "2021"
description = "Incremental binary serial-frame parser (magic/length/seq/payload/CRC32) with an Axum HTTP replay service"
license = "MIT"

[lib]
name = "serialframe"
path = "src/lib.rs"

[[bin]]
name = "replay-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
