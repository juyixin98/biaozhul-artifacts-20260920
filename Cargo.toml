[package]
name = "incremental-merkle"
version = "0.1.0"
edition = "2021"
description = "Incremental Merkle verification: file-backed chunk store, range proofs, injectable I/O fault layer"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bin]]
name = "imerkle"
path = "src/main.rs"

[profile.release]
panic = "unwind"
