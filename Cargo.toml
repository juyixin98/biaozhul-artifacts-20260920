[package]
name = "seglog"
version = "0.1.0"
edition = "2021"
description = "Segmented append-only log with crash recovery (length + sequence number + CRC32)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "seglog"
path = "src/main.rs"

[profile.release]
panic = "unwind"
