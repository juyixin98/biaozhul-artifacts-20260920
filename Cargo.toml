[package]
name = "canonical-huffman"
version = "0.1.0"
edition = "2021"
description = "Streaming canonical Huffman codec with a JSON control entry point"
license = "MIT"
readme = "README.md"

[lib]
name = "canonical_huffman"
path = "src/lib.rs"

[[bin]]
name = "chfc"
path = "src/bin/chfc.rs"

[profile.release]
opt-level = 3
lto = "thin"
