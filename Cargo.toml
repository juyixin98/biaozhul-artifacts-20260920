[package]
name = "depres"
version = "0.1.0"
edition = "2021"
description = "Backtracking dependency version constraint solver with an Axum HTTP API"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }

[[bin]]
name = "depres"
path = "src/main.rs"

[profile.release]
lto = true
