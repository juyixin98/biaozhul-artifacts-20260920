[package]
name = "tritmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Column-value bitmap indexes with SQL three-valued logic filtering (AND/OR/NOT/IS NULL) over versioned deletions"
license = "MIT OR Apache-2.0"

[lib]
name = "tritmap"
path = "src/lib.rs"

[[bin]]
name = "tritmap"
path = "src/main.rs"

[dependencies]
# Key dependencies are pinned exactly; Cargo.lock is committed for a fully reproducible build.
arrow2 = { version = "=0.18.0", default-features = false, features = ["compute"] }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
clap = { version = "=4.6.7", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
thiserror = "=2.0.21"
csv = "=1.4.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
