[package]
name = "lockmgr"
version = "0.1.0"
edition = "2021"
description = "Single-process two-phase lock manager with wait-for graph deadlock detection (Axum HTTP backend)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
