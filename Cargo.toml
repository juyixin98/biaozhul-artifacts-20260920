[package]
name = "artifact-delta"
version = "0.1.0"
edition = "2021"
description = "Block-level on-demand delta artifact transfer service (rsync-style rolling checksum + strong hash confirmation)"

[lib]
name = "artifact_delta"
path = "src/lib.rs"

[[bin]]
name = "artifact-delta"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
base64 = "0.22"

[profile.release]
lto = true
