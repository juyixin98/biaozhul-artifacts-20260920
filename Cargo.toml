[package]
name = "chunked-upload"
version = "0.1.0"
edition = "2021"
description = "Immutable large-object chunked resumable upload service (Axum)"

[lib]
name = "chunked_upload"
path = "src/lib.rs"

[[bin]]
name = "chunked-upload"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }

[profile.release]
# 小体积发布；测试用 dev profile，不受影响
strip = true
