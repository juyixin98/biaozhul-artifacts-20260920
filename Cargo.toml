[package]
name = "swap-router"
version = "0.1.0"
edition = "2021"
description = "Single-chain offline swap router: exact quotes over <=3-hop constant-product pool paths"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "tracing", "http1"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "swap_router"
path = "src/lib.rs"

[[bin]]
name = "swap-router"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
