[package]
name = "build-provenance-verify"
version = "0.1.0"
edition = "2021"
description = "Build provenance (SLSA-style) verification HTTP service"
license = "MIT"

[lib]
name = "provenance"
path = "src/lib.rs"

[[bin]]
name = "provenance-server"
path = "src/main.rs"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
