[package]
name = "mvcc-kv"
version = "0.1.0"
edition = "2021"
description = "Single-process in-memory MVCC key-value service with snapshot reads, tombstones and version GC (Axum)"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "mvcc-kv"
path = "src/main.rs"
