[package]
name = "merkle-proof-service"
version = "0.1.0"
edition = "2021"
description = "Versioned key-value Merkle tree proof service (Axum + RocksDB)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[[bin]]
name = "merkle-proof-service"
path = "src/main.rs"

[profile.release]
panic = "abort"
