[package]
name = "mvcc-reclaim"
version = "0.1.0"
edition = "2021"
description = "File-backed single-machine MVCC key/value store with snapshot transactions and version reclamation"

[lib]
name = "mvcc_reclaim"
path = "src/lib.rs"

[[bin]]
name = "mvcc-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
