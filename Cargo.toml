[package]
name = "cas-store"
version = "0.1.0"
edition = "2021"
description = "Content-addressable block store with named roots, atomic publishes and mark-sweep GC"
license = "MIT"

[lib]
name = "cas_store"
path = "src/lib.rs"

[[bin]]
name = "cas-store"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
