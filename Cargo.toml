[package]
name = "range-lock-deadlock"
version = "0.1.0"
edition = "2021"
description = "Transactional interval (range) lock service with wait queues and deterministic deadlock detection"

[lib]
name = "range_lock"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
