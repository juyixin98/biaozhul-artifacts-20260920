[package]
name = "tls-record-observer"
version = "0.1.0"
edition = "2021"
description = "Incremental TLS record header / plaintext ClientHello observer (no decryption, no handshake implementation)"

[lib]
name = "tls_record_observer"
path = "src/lib.rs"

[[bin]]
name = "tls-observer-server"
path = "src/main.rs"

[profile.release]
opt-level = 3

# Intentionally no third-party dependencies:
# the incremental byte parser is hand-written (project requirement) and the
# demo server emits JSON via a small internal serializer, so `cargo build`
# works fully offline.
[dependencies]
