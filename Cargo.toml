[package]
name = "bitindex3vl"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Column-value bitmap indexes with SQL three-valued-logic filtering (AND/OR/NOT/IS NULL) over versioned deletions"
license = "MIT"

[lib]
name = "bitindex3vl"
path = "src/lib.rs"

[[bin]]
name = "bitindex3vl"
path = "src/main.rs"

[dependencies]
# Pinned key dependencies (offline-friendly; resolved from the local registry cache).
arrow2 = { version = "=0.18.0", default-features = false }
axum = { version = "=0.7.9", features = ["json", "tokio", "http1"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.18.1", features = ["v4"] }
toml = "=0.8.23"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.21"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
