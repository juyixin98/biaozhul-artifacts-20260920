[package]
name = "oci-layer-unpack"
version = "0.1.0"
edition = "2021"
description = "Offline OCI image layered-whitelist extraction backend (Axum + tar)"

[lib]
name = "oci_unpack"
path = "src/lib.rs"

[[bin]]
name = "oci-unpack-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "form",
    "http1",
    "json",
    "matched-path",
    "original-uri",
    "query",
    "tokio",
    "tower-log",
    "tracing",
] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "signal"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.1"
tar = "0.4.46"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "ansi",
    "env-filter",
] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
