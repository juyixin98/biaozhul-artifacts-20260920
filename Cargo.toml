[package]
name = "artifact-delta"
version = "0.1.0"
edition = "2021"
description = "Block-level on-demand artifact delta transfer service (rolling weak checksum + strong hash confirmation)"

[lib]
name = "artifact_delta"
path = "src/lib.rs"

[[bin]]
name = "delta-server"
path = "src/main.rs"

[[bin]]
name = "delta-client"
path = "src/bin/client.rs"

[dependencies]
axum = "0.8"
bytes = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Plain HTTP is enough (loopback demo); TLS feature intentionally disabled.
ureq = { version = "2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
