[package]
name = "incr-build-planner"
version = "0.1.0"
edition = "2021"
description = "Local incremental build planner over a dependency graph (Axum HTTP service)"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "incr-build-planner"
path = "src/main.rs"

[profile.release]
# 纯计算服务，去掉 panic 路径/unwind 表，让交付二进制更小
strip = true
