[package]
name = "utxo-rollback-validator"
version = "0.1.0"
edition = "2021"
description = "Offline-chain UTXO state service with rollback / reorg support (Axum + SQLite)"
rust-version = "1.75"

[lib]
name = "utxo_rollback"
path = "src/lib.rs"

[[bin]]
name = "utxo-server"
path = "src/bin/server.rs"

[[bin]]
name = "utxo-cli"
path = "src/bin/cli.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
