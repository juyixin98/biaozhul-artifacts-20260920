[package]
name = "watchdog-host"
version = "0.1.0"
edition = "2021"
description = "Host-side recovery state machine for a device firmware watchdog"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
