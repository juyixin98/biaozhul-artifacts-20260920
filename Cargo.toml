[package]
name = "artifact-promotion"
version = "0.1.0"
edition = "2021"
description = "制品分阶段晋级状态机后端 (Axum)"

[lib]
name = "artifact_promotion"
path = "src/lib.rs"

[[bin]]
name = "artifact-promotion"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
