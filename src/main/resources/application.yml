server:
  port: 8080

spring:
  application:
    name: it-asset-lifecycle
  datasource:
    url: jdbc:mysql://localhost:13307/itasset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: itasset
    password: itassetpass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # 折旧计提完成后是否将状态变化视为审计信息，无额外开关
  seed-sample: false

logging:
  level:
    com.example.itasset: INFO
    org.hibernate.SQL: WARN
