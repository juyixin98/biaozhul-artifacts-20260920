services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillpulse
      POSTGRES_PASSWORD: skillpulse
      POSTGRES_DB: skillpulse
    ports:
      - "5432:5432"
    volumes:
      - skillpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://skillpulse:skillpulse@db:5432/skillpulse
      SEED_DEMO: "1"
      ALLOW_CLOCK_CONTROL: "1"
    ports:
      - "8000:8000"

volumes:
  skillpulse_pgdata:
